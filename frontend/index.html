<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSankalan</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen shown while React boots -->
      <style>
        .splash-screen {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          font-family: 'Plus Jakarta Sans', sans-serif;
          z-index: 9999;
          transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .splash-logo-container {
          position: relative;
          width: 96px;
          height: 96px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 2rem;
        }
        .splash-logo-container::before {
          content: '';
          position: absolute;
          inset: -12px;
          border-radius: 50%;
          background: conic-gradient(from 0deg, transparent, transparent, transparent, #1b6d24);
          animation: splash-spin 2s linear infinite;
        }
        .splash-logo-container::after {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: #ffffff;
          z-index: 1;
        }
        .splash-logo {
          position: relative;
          width: 72px;
          height: 72px;
          z-index: 2;
          object-fit: contain;
          animation: splash-pulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .splash-brand {
          font-size: 1.5rem;
          font-weight: 800;
          color: #1a1c19;
          letter-spacing: -0.02em;
          margin: 0;
          background: linear-gradient(135deg, #1b6d24 0%, #005127 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .splash-text {
          margin-top: 0.75rem;
          font-size: 0.875rem;
          font-weight: 500;
          color: #727970;
          letter-spacing: 0.02em;
        }
        @keyframes splash-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes splash-pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(0.95); opacity: 0.9; }
        }
      </style>
      <div class="splash-screen" id="app-splash">
        <div class="splash-logo-container">
          <img src="/logo.png" alt="EcoSankalan" class="splash-logo" />
        </div>
        <h2 class="splash-brand">EcoSankalan</h2>
        <p class="splash-text">Preparing your dashboard...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
